# Builds the plugin inside the prebuilt :dev image (published by docker-publish.yml).
name: ci

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  image-name:
    runs-on: ubuntu-latest
    outputs:
      dev: ${{ steps.name.outputs.dev }}
    steps:
      - id: name
        run: echo "dev=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/viennaps-paraview:dev" >> "$GITHUB_OUTPUT"

  build-plugin:
    needs: image-name
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image-name.outputs.dev }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: |
          cmake -GNinja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DParaView_DIR=/opt/paraview/lib/cmake/paraview-6.1

      - name: Build
        run: cmake --build build -j"$(nproc)"
